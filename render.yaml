services:
  - type: web
    name: quotapp-api
    runtime: docker
    dockerfilePath: spring-api/Dockerfile
    dockerContext: spring-api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_APP_ROLE_PASSWORD
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_STT_URL
        sync: false
      - key: OPENAI_STT_MODEL
        sync: false
      - key: OPENAI_CHAT_URL
        sync: false
      - key: OPENAI_CHAT_MODEL
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: XAI_STT_URL
        sync: false
      - key: XAI_CHAT_URL
        sync: false
      - key: XAI_CHAT_MODEL
        sync: false
      - key: DEFAULT_STT_PROVIDER
        value: whisper
      - key: DEFAULT_LLM_PROVIDER
        value: openai
      - key: DEV_BYPASS_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
